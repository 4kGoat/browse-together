<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="browse-together" content="1">
<title>Browse Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1625; --stage:#0f0c17; --panel:#231e31; --panel2:#2c2640; --raise:#3a3254; --line:#3a3252;
  --text:#efeaff; --muted:#a49bbf; --faint:#7d7499;
  --gold:#ffc24b; --gold-hi:#ffd27a; --gold-ink:#2b1d00; --peri:#93a5ff; --danger:#ff6f7d; --ok:#83dba8;
  --accent:var(--peri);
  --r-sm:9px; --r-md:12px;
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --ui:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 13px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:600;font-size:13.5px;cursor:pointer;
  white-space:nowrap;text-decoration:none;transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:var(--raise)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.primary:hover{background:var(--gold-hi);border-color:var(--gold-hi)}
.btn.icon{width:36px;padding:0}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted)}
.btn.quiet:hover{background:var(--panel2);color:var(--text)}
.btn.on{background:rgba(147,165,255,.16);border-color:var(--peri)}
.btn.warn{border-color:var(--gold);color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.field{height:36px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 12px;outline:none;min-width:0;color:var(--text)}
.field::placeholder{color:var(--faint)}
.field:focus{border-color:var(--peri)}
.btn:focus-visible,.field:focus-visible,.seg button:focus-visible,.roomcode:focus-visible,.switch:focus-visible,a:focus-visible{outline:2px solid var(--peri);outline-offset:2px}
a{color:var(--peri)}

/* Lobby */
#lobby{min-height:100%;display:grid;place-items:center;padding:32px 18px}
.lobby{width:100%;max-width:380px}
.wordmark{font-family:var(--display);font-weight:800;font-size:clamp(46px,11vw,64px);line-height:.9;letter-spacing:-.035em;margin:0 0 16px}
.wordmark span{display:block}
.wordmark span + span{color:var(--gold)}
.tagline{color:var(--muted);font-size:16px;margin:0 0 30px;max-width:30ch}
.lobby label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
.lobby .field{width:100%;height:46px;font-size:15px}
.lobby .btn{height:46px;font-size:15px;padding:0 18px}
#createBtn{width:100%;margin-top:12px}
.divider{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:13px;margin:24px 0 10px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
.joinrow{display:flex;gap:8px}
#code{font-family:var(--display);font-weight:700;letter-spacing:.2em;text-transform:uppercase}
#code::placeholder{font-family:var(--ui);font-weight:400;letter-spacing:normal;text-transform:none}
#status{min-height:1.4em;margin-top:12px;color:var(--gold);font-size:13.5px}
.lobby-note{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.lobby-note a{font-weight:600}

/* Room layout */
#room{height:100%;width:100%;overflow:hidden;display:grid;
  grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto auto minmax(0,1fr) auto}
.topbar{grid-column:1/3;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:10px 14px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.roomcode{display:inline-flex;align-items:baseline;gap:10px;padding:3px 12px 4px;border-radius:var(--r-md);
  border:1px dashed var(--line);background:var(--bg);color:var(--text);cursor:pointer}
.roomcode:hover{border-color:var(--gold)}
.roomcode .code{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.14em}
.roomcode .hint{font-size:12.5px;font-weight:600;color:var(--muted)}
.roomcode:hover .hint{color:var(--gold)}
#people{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;background:var(--panel2);font-size:13px;font-weight:600}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip .tag{font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);padding:1px 7px;border-radius:7px}
.chip .tag.live{color:var(--gold)}
.top-right{margin-left:auto;display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--bg);border:1px solid var(--line)}
.seg button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:0;border-radius:8px;
  background:transparent;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--raise);color:var(--text)}
.switch{display:inline-flex;align-items:center;gap:9px;height:36px;padding:0 12px 0 9px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:600;font-size:13.5px;cursor:pointer}
.switch .track{position:relative;width:30px;height:18px;border-radius:9px;background:var(--line);transition:background .15s}
.switch .track::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.switch[aria-checked="true"]{border-color:var(--peri)}
.switch[aria-checked="true"] .track{background:var(--peri)}
.switch[aria-checked="true"] .track::after{transform:translateX(12px);background:#fff}

#toolbar{grid-column:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;
  background:var(--panel);border-bottom:1px solid var(--line)}
#screenTools,#urlForm{display:flex;align-items:center;gap:6px;min-width:0}
#screenTools{flex:0 1 auto}
#screenTools.wide,#urlForm{flex:1 1 560px;min-width:min(560px,100%)}
#navForm{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
#navInput,#urlInput{flex:1;min-width:90px}
.tools{display:flex;align-items:center;gap:6px;margin-left:auto}
#drawTools{display:flex;align-items:center;gap:6px;padding-left:8px;margin-left:2px;border-left:1px solid var(--line)}
.pen{width:var(--s,8px);height:var(--s,8px);border-radius:50%;background:currentColor;flex:none}
/* Join requests (host) */
#requests{position:absolute;top:12px;right:12px;z-index:10;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100% - 24px))}
.req{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;background:var(--panel);border:1px solid var(--gold);border-radius:var(--r-md);box-shadow:0 8px 28px #0008}
.req .who{flex:1;min-width:0;overflow-wrap:anywhere}
.req .btn{height:32px;padding:0 11px;font-size:13px}
.chip .kick{width:20px;height:20px;margin:0 -5px 0 -2px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--faint);font-size:16px;line-height:1;cursor:pointer}
.chip .kick:hover{background:var(--raise);color:var(--text)}
.chip .kick:focus-visible{outline:2px solid var(--peri)}
#cancelJoin{margin-top:6px;height:34px;font-size:13.5px}

/* Volume */
.vol{display:flex;align-items:center;gap:2px}
#volSlider{width:110px;height:20px;margin:0 6px 0 0;accent-color:var(--gold);cursor:pointer;background:transparent}
#sizeBtn[data-size="S"] .pen{--s:4px} #sizeBtn[data-size="M"] .pen{--s:8px} #sizeBtn[data-size="L"] .pen{--s:13px}

#stage{grid-column:1;min-width:0;min-height:0;position:relative;background:var(--stage);overflow:hidden}
#video{width:100%;height:100%;object-fit:contain;display:block}
#frame{width:100%;height:100%;border:0;background:#fff;display:block}
#placeholder{position:absolute;inset:0;display:grid;place-items:center;padding:28px;text-align:center}
#placeholder .ph{max-width:440px}
#phTitle{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.015em;line-height:1.15;margin:0 0 10px}
#phText{color:var(--muted);font-size:15px;margin:0}
#overlay{position:absolute;inset:0;z-index:5;outline:none}
#overlay.ctl:focus{box-shadow:inset 0 0 0 2px var(--peri)}
#unmute{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:9}

#statusbar{grid-column:1;min-width:0;min-height:34px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;
  padding:7px 14px;background:var(--panel);border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
#statusbar .warn{color:var(--gold);font-weight:600}
#statusbar .ok{color:var(--ok)}

/* Cursors, clicks, drawing, stickers */
.cursor{position:absolute;pointer-events:none;transform:translate(-2px,-2px);transition:left .06s linear,top .06s linear;z-index:8}
.cursor svg{display:block;filter:drop-shadow(0 1px 2px #000a)}
.cursor span{position:absolute;left:16px;top:14px;font-size:12px;font-weight:700;padding:1px 7px;border-radius:7px;color:#1a1625;white-space:nowrap}
.ripple{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid;pointer-events:none;animation:rip .7s ease-out forwards;z-index:8}
@keyframes rip{from{transform:scale(.2);opacity:1}to{transform:scale(1.6);opacity:0}}
#draw{position:absolute;left:0;top:0;z-index:7;pointer-events:none;touch-action:none}
#draw.on{pointer-events:auto;cursor:crosshair}
#stickers{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.sticker{position:absolute;pointer-events:auto;cursor:grab;touch-action:none;user-select:none}
.sticker:active{cursor:grabbing}
.sticker img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.sticker .h{display:none;position:absolute}
.sticker.sel{outline:2px dashed var(--peri);outline-offset:3px}
.sticker.sel .h{display:block}
.sticker .rot{left:50%;top:-34px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--peri);border:2px solid #fff;cursor:grab}
.sticker .rot::after{content:'';position:absolute;left:50%;top:16px;width:2px;height:14px;margin-left:-1px;background:var(--peri)}
.sticker .scale{right:-10px;bottom:-10px;width:18px;height:18px;background:#fff;border:2px solid var(--peri);border-radius:4px;cursor:nwse-resize}
.sticker .del{right:-13px;top:-13px;width:26px;height:26px;padding:0;border:0;border-radius:50%;background:var(--danger);color:#fff;font-size:17px;line-height:1;cursor:pointer}
#stage.dropping{box-shadow:inset 0 0 0 3px var(--gold)}
@media (prefers-reduced-motion:reduce){.ripple,.cursor,.switch .track,.switch .track::after{animation:none;transition:none}}

/* Chat */
aside{grid-column:2;grid-row:2/5;min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line)}
.chat-title{padding:12px 14px 4px;font-family:var(--display);font-weight:700;font-size:15px}
#log{flex:1;overflow-y:auto;overflow-wrap:anywhere;padding:6px 14px 12px;display:flex;flex-direction:column;gap:9px}
.msg b{display:block;font-size:12.5px;line-height:1.3}
.sys{color:var(--faint);font-size:12.5px}
#chatForm{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
#chatInput{flex:1}

@media (max-width:1100px){
  #room{grid-template-columns:minmax(0,1fr) 250px}
  #screenTools,#urlForm{flex-basis:100%}
  .roomcode .hint{display:none}
}
@media (max-width:760px){
  #room{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 52vh auto minmax(0,1fr)}
  .topbar{grid-column:1}
  .brand{display:none}
  .top-right{margin-left:0}
  aside{grid-column:1;grid-row:5;border-left:0;border-top:1px solid var(--line)}
  .tools .lbl{display:none}
  #volSlider{width:80px}
  #screenTools{flex-wrap:wrap}
  #navForm{flex-basis:100%}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-share" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 14V8m-3 3 3-3 3 3M8 21h8"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
  <symbol id="i-reload" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11a2.12 2.12 0 0 0-3-3L5 16l-1 4z"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-tab" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
  <symbol id="i-point" viewBox="0 0 24 24"><path d="M5 3l14 7-6 2-2 6z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12 20 4l-6 16-3-7z"/></symbol>
  <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3v4M15 3v4M7 7h10v4a5 5 0 0 1-10 0zM12 16v5"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10zM17 9a4 4 0 0 1 0 6"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10zM17 10l4 4M21 10l-4 4"/></symbol>
</svg>

<!-- LOBBY -->
<main id="lobby">
  <div class="lobby">
    <h1 class="wordmark"><span>Browse</span><span>Together</span></h1>
    <p class="tagline">Share a tab with friends, watch it live, and take turns driving.</p>
    <label for="name">Your name</label>
    <input class="field" id="name" maxlength="20" placeholder="What should friends call you?" autocomplete="nickname">
    <button class="btn primary" id="createBtn">Start a room</button>
    <div class="divider">or join with a code</div>
    <div class="joinrow">
      <input class="field" id="code" maxlength="5" placeholder="Room code" aria-label="Room code" autocomplete="off" spellcheck="false">
      <button class="btn" id="joinBtn">Join</button>
    </div>
    <div id="status" role="status"></div>
    <button class="btn quiet" id="cancelJoin" hidden>Cancel</button>
    <p class="lobby-note">
      Want friends to click and type in the tab you share?
      <a href="https://raw.githubusercontent.com/4kGoat/browse-together/main/browse-together-control.user.js" target="_blank" rel="noopener">Set up tab control</a>
      (needs <a href="https://www.tampermonkey.net/" target="_blank" rel="noopener">Tampermonkey</a>). Only the person sharing needs it.
      <a href="https://github.com/4kGoat/browse-together#letting-friends-control-the-shared-tab-host-only" target="_blank" rel="noopener">How it works</a>
    </p>
  </div>
</main>

<!-- ROOM -->
<div id="room" hidden>
  <header class="topbar">
    <span class="brand">Browse Together</span>
    <button class="roomcode" id="copyBtn" title="Copy a link friends can open to join">
      <span class="code" id="roomCode"></span><span class="hint">Copy invite link</span>
    </button>
    <div id="people" aria-label="People in the room"></div>
    <div class="top-right">
      <a class="btn" id="scriptLink" href="https://raw.githubusercontent.com/4kGoat/browse-together/main/browse-together-control.user.js" target="_blank" rel="noopener"
         title="Install the Tampermonkey script that lets the room click and type in your shared tab"><svg class="ic"><use href="#i-plug"/></svg><span class="lbl">Set up tab control</span></a>
      <button class="switch" id="controlBtn" role="switch" aria-checked="false" hidden
         title="Let everyone in the room click, scroll, type and open sites in the shared tab. You can always control it."><span class="track"></span><span>Let friends control</span></button>
      <div class="seg" role="tablist" aria-label="What everyone sees">
        <button data-mode="screen" title="Watch a tab someone shares"><svg class="ic"><use href="#i-tab"/></svg>Shared tab</button>
        <button data-mode="page" title="Load a website inside the room for everyone"><svg class="ic"><use href="#i-globe"/></svg>Embedded site</button>
      </div>
    </div>
  </header>

  <div id="toolbar">
    <div id="screenTools">
      <button class="btn primary" id="shareBtn"><svg class="ic"><use href="#i-share"/></svg><span class="lbl">Share my tab</span></button>
      <form id="navForm" hidden title="Opens sites in the shared tab">
        <button type="button" class="btn icon quiet" id="navBack" title="Back" aria-label="Back"><svg class="ic"><use href="#i-back"/></svg></button>
        <button type="button" class="btn icon quiet" id="navFwd" title="Forward" aria-label="Forward"><svg class="ic"><use href="#i-fwd"/></svg></button>
        <button type="button" class="btn icon quiet" id="navReload" title="Reload" aria-label="Reload"><svg class="ic"><use href="#i-reload"/></svg></button>
        <input class="field" id="navInput" placeholder="Open a site in the shared tab" autocomplete="off" spellcheck="false" aria-label="Address of the shared tab">
        <button type="submit" class="btn">Open</button>
      </form>
    </div>
    <form id="urlForm" hidden>
      <input class="field" id="urlInput" placeholder="Paste a link to load it for everyone" aria-label="Website to embed">
      <button type="submit" class="btn primary">Load for everyone</button>
      <button type="button" class="btn" id="pointBtn" title="Point at things on the page without clicking them"><svg class="ic"><use href="#i-point"/></svg><span class="lbl">Point</span></button>
    </form>
    <div class="tools">
      <button class="btn" id="stickerBtn" title="Add an image for everyone. You can also paste an image or image link (Ctrl+V), or drop one onto the view."><svg class="ic"><use href="#i-image"/></svg><span class="lbl">Add sticker</span></button>
      <input type="file" id="stickerFile" accept="image/*" hidden>
      <button class="btn" id="drawBtn" title="Draw on top of what everyone sees"><svg class="ic"><use href="#i-pen"/></svg><span class="lbl">Draw</span></button>
      <div id="drawTools" hidden>
        <button class="btn" id="sizeBtn" data-size="M" title="Change pen size"><span class="pen"></span><span class="lbl">Medium</span></button>
        <button class="btn icon" id="undoBtn" title="Undo your last line (Ctrl+Z)" aria-label="Undo"><svg class="ic"><use href="#i-undo"/></svg></button>
        <button class="btn icon" id="clearBtn" title="Clear all drawings for everyone" aria-label="Clear drawings"><svg class="ic"><use href="#i-trash"/></svg></button>
      </div>
      <div class="vol" id="volume" hidden>
        <button class="btn icon quiet" id="muteBtn" title="Mute" aria-label="Mute"><svg class="ic"><use href="#i-sound"/></svg></button>
        <input type="range" id="volSlider" min="0" max="1" step="0.01" value="1" aria-label="Volume" title="Volume">
      </div>
      <button class="btn icon quiet" id="fsBtn" title="Full screen" aria-label="Full screen"><svg class="ic"><use href="#i-expand"/></svg></button>
    </div>
  </div>

  <div id="stage">
    <video id="video" playsinline autoplay></video>
    <iframe id="frame" hidden allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation"></iframe>
    <div id="placeholder"><div class="ph"><h2 id="phTitle"></h2><p id="phText"></p></div></div>
    <div id="overlay"></div>
    <div id="stickers"></div>
    <canvas id="draw"></canvas>
    <div id="requests" aria-live="polite"></div>
    <button class="btn primary" id="unmute" hidden><svg class="ic"><use href="#i-sound"/></svg>Turn on sound</button>
  </div>

  <div id="statusbar" role="status"><span id="shareInfo"></span></div>

  <aside>
    <div class="chat-title">Chat</div>
    <div id="log"></div>
    <form id="chatForm">
      <input class="field" id="chatInput" placeholder="Message the room" maxlength="400" aria-label="Message">
      <button class="btn primary icon" title="Send" aria-label="Send"><svg class="ic"><use href="#i-send"/></svg></button>
    </form>
  </aside>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const PREFIX = 'browse-together-v1-';
const COLORS = ['#ff6b6b','#ffd93d','#6bcb77','#6cc4ff','#c77dff','#ff9f1c','#2ec4b6','#f15bb5'];

let peer, isHost = false, hostConn = null, roomCode = '';
const conns = new Map();   // host only: peerId -> DataConnection
const calls = new Map();   // sharer only: peerId -> MediaConnection
let myId, people = {}, sharer = null, localStream = null;
let mode = 'screen', curUrl = '', pointMode = false, control = false, hasBridge = false, bridgeKey = '', tabInfo = null, bridgeVersion = '';
const bridgeKeys = new Set();   // more than one = the script is installed twice
const NEEDED_SCRIPT = '2.4.0';

const video = $('#video'), frame = $('#frame'), overlay = $('#overlay');
const canvas = $('#draw'), ctx = canvas.getContext('2d');
let strokes = [];                 // { id, from, c, w, mode, pts:[[x,y],...] }
const strokeMap = new Map();
const stickers = new Map();       // id -> { id, from, src, x, y, w, r, a, z, mode, el }
let selectedSticker = null, topZ = 1, stickerN = 0;
const unit = v => { const n = Number(v); return Number.isFinite(n) ? Math.min(1, Math.max(0, n)) : 0; };

// ---------- lobby ----------
try { $('#name').value = localStorage.getItem('bt-name') || ''; } catch(e){}
if (location.hash.length > 1) $('#code').value = location.hash.slice(1).toUpperCase();

function myName(){
  const n = ($('#name').value.trim() || 'Player').slice(0,20);
  try { localStorage.setItem('bt-name', n); } catch(e){}
  return n;
}
function setStatus(t){ $('#status').textContent = t; }
function lobbyBusy(b){ $('#createBtn').disabled = $('#joinBtn').disabled = b; }
function randCode(){
  const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({length:5}, () => a[Math.random()*a.length|0]).join('');
}

$('#createBtn').onclick = () => { if (!window.Peer) return setStatus('Couldn\'t connect. Check your internet and reload the page.'); lobbyBusy(true); startHost(randCode()); };
$('#joinBtn').onclick = () => {
  const c = $('#code').value.trim().toUpperCase();
  if (!c) return setStatus('Type the room code first.');
  if (!window.Peer) return setStatus('Couldn\'t connect. Check your internet and reload the page.');
  lobbyBusy(true); startGuest(c);
};
$('#cancelJoin').onclick = () => location.reload();
$('#code').addEventListener('keydown', e => { if (e.key === 'Enter') $('#joinBtn').click(); });

function handleErr(e){
  if (e.type === 'peer-unavailable') setStatus('No room with that code. Check it, and make sure the host still has the room open.');
  else setStatus('Couldn\'t connect (' + e.type + '). Try again in a moment.');
  lobbyBusy(false);
}

// ---------- host ----------
function startHost(code){
  isHost = true; setStatus('Starting a room…');
  peer = new Peer(PREFIX + code);
  peer.on('open', id => {
    myId = id;
    people[id] = { id, name: myName(), color: COLORS[0] };
    enterRoom(code);
    sys('Room ' + code + ' is ready. Click the code at the top to copy an invite link.');
  });
  peer.on('connection', conn => {
    // New connections wait here, seeing nothing, until the host lets them in.
    conn.on('open', () => joinRequests.set(conn.peer, { conn, name:'' }));
    conn.on('data', d => onData(d, conn.peer));
    conn.on('close', () => { cancelRequest(conn.peer); dropPerson(conn.peer); });
    conn.on('error', () => { cancelRequest(conn.peer); dropPerson(conn.peer); });
  });
  peer.on('call', answerCall);
  peer.on('error', e => {
    if (e.type === 'unavailable-id') { peer.destroy(); startHost(randCode()); }
    else if (!myId) handleErr(e);
  });
}
function freeColor(){
  const used = Object.values(people).map(p => p.color);
  return COLORS.find(c => !used.includes(c)) || COLORS[Math.random()*COLORS.length|0];
}
// ---------- join requests (host) ----------
const joinRequests = new Map();   // peerId -> { conn, name }
function askToJoin(id, name){
  const p = joinRequests.get(id);
  if (!p || p.name) return;          // one request per connection
  p.name = name;
  const card = document.createElement('div'); card.className = 'req'; card.dataset.id = id;
  const who = document.createElement('span'); who.className = 'who';
  const b = document.createElement('b'); b.textContent = name;
  who.append(b, document.createTextNode(' wants to join'));
  const yes = document.createElement('button'); yes.className = 'btn primary'; yes.textContent = 'Let in';
  const no = document.createElement('button'); no.className = 'btn'; no.textContent = 'Decline';
  yes.onclick = () => admit(id);
  no.onclick = () => decline(id);
  card.append(who, yes, no);
  $('#requests').append(card);
  sys(name + ' is asking to join.');
}
function removeRequestCard(id){
  const card = [...$('#requests').children].find(c => c.dataset.id === id);
  if (card) card.remove();
}
function admit(id){
  const p = joinRequests.get(id); if (!p || !p.conn.open) return cancelRequest(id);
  joinRequests.delete(id); removeRequestCard(id);
  conns.set(id, p.conn);
  people[id] = { id, name:p.name || 'Player', color:freeColor() };
  p.conn.send({ type:'welcome', people, mode, url:curUrl, sharer, control, strokes, stickers:stickerList(), tabInfo, from:myId });
  const m = { type:'people', people, joined:id, sharer, from:myId };
  apply(m); relay(m, id);
}
function decline(id){
  const p = joinRequests.get(id); if (!p) return;
  joinRequests.delete(id); removeRequestCard(id);
  try { p.conn.send({ type:'denied' }); } catch(e){}
  setTimeout(() => { try { p.conn.close(); } catch(e){} }, 400);
  sys('You declined ' + (p.name || 'a request') + '.');
}
function cancelRequest(id){
  const p = joinRequests.get(id); if (!p) return;
  joinRequests.delete(id); removeRequestCard(id);
  if (p.name) sys(p.name + ' stopped waiting.');
}
function removePerson(id){
  const p = people[id]; if (!p || id === myId) return;
  if (!confirm('Remove ' + p.name + ' from the room?')) return;
  const c = conns.get(id);
  if (c){ try { c.send({ type:'removed' }); } catch(e){} setTimeout(() => { try { c.close(); } catch(e){} }, 400); }
  dropPerson(id);
}

function dropPerson(id){
  conns.delete(id);
  if (!people[id]) return;
  const name = people[id].name, kind = people[id].kind;
  delete people[id];
  if (sharer === id) sharer = null;
  const m = { type:'people', people, left:id, leftName:name, leftKind:kind, sharer, from:myId };
  apply(m); relay(m, null);
}

// ---------- guest ----------
function startGuest(code){
  setStatus('Connecting…');
  peer = new Peer();
  peer.on('open', id => {
    myId = id;
    hostConn = peer.connect(PREFIX + code, { reliable:true });
    let leaving = false;
    hostConn.on('open', () => {
      hostConn.send({ type:'hello', name: myName() });
      setStatus('Waiting for the host to let you in…');
      $('#cancelJoin').hidden = false;
    });
    hostConn.on('data', d => {
      if (!d || typeof d !== 'object') return;
      if (!roomCode){
        if (d.type === 'welcome'){ $('#cancelJoin').hidden = true; setStatus(''); enterRoom(code); onData(d, PREFIX + code); }
        else if (d.type === 'denied'){
          leaving = true; $('#cancelJoin').hidden = true;
          setStatus('The host didn\'t let you in.');
          try { peer.destroy(); } catch(e){}
          lobbyBusy(false);
        }
        return;
      }
      if (d.type === 'removed'){ leaving = true; alert('The host removed you from the room.'); location.reload(); return; }
      onData(d, PREFIX + code);
    });
    hostConn.on('close', () => {
      if (leaving) return;
      if (!roomCode){ $('#cancelJoin').hidden = true; setStatus('The room closed before you were let in.'); lobbyBusy(false); return; }
      alert('The host left, so this room has closed.'); location.reload();
    });
  });
  peer.on('call', answerCall);
  peer.on('error', e => { if (!roomCode) handleErr(e); });
}

// ---------- messaging ----------
function send(msg){
  msg.from = myId;
  if (msg.type === 'input'){
    if (isHost) routeInput(msg);                    // the host can always control
    else if (hasBridge) forwardToBridge(msg, true); // my own tab, straight through
    else if (hostConn && hostConn.open) hostConn.send(msg);
    return;
  }
  apply(msg);
  if (isHost) relay(msg, null);
  else if (hostConn && hostConn.open) hostConn.send(msg);
}
// Input goes to whoever in the room has the Tampermonkey script running on their room page.
function routeInput(msg){
  for (const id in people){
    if (!people[id].bridge) continue;
    if (id === myId) forwardToBridge(msg, true);
    else { const c = conns.get(id); if (c && c.open) c.send(msg); }
  }
}
function olderThan(a, b){
  const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number);
  for (let i = 0; i < 3; i++){ if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) < (y[i] || 0); }
  return false;
}
function scriptOutdated(){ return hasBridge && (!bridgeVersion || olderThan(bridgeVersion, NEEDED_SCRIPT)); }
function hostId(){ return PREFIX + roomCode; }
// Allowed: the host, the tab's owner, or anyone while "Let friends control" is on.
function mayControl(from){ return control || from === hostId() || from === myId; }
function forwardToBridge(msg, ok){
  if (hasBridge && ok) window.postMessage({ bt:'in', key:bridgeKey, msg }, '*');
}
function pushBridgeState(){
  if (hasBridge) window.postMessage({ bt:'state', key:bridgeKey, room:roomCode, control }, '*');
}
window.addEventListener('message', e => {
  // The controlled tab reports which page it's on; share that with the room.
  if (e.data && e.data.bt === 'tabinfo' && hasBridge && e.data.key === bridgeKey){
    const url = safeUrl(e.data.url);
    if (url && roomCode && (!tabInfo || tabInfo.url !== url || tabInfo.title !== String(e.data.title || '')))
      send({ type:'tabinfo', url, title:String(e.data.title || '').slice(0, 200) });
    return;
  }
  if ((e.source && e.source !== window) || !e.data || e.data.bt !== 'bridge-ready') return;
  if (typeof e.data.key !== 'string' || !e.data.key) return;
  const first = !hasBridge;
  bridgeKeys.add(e.data.key);
  if (bridgeKeys.size === 2) sys('Tab control is installed more than once in Tampermonkey. Open the Tampermonkey dashboard, delete the extra copies, then reload this page and the shared tab.');
  bridgeKey = e.data.key; hasBridge = true;
  bridgeVersion = typeof e.data.version === 'string' ? e.data.version.slice(0, 20) : '';
  pushBridgeState();
  if (first && roomCode) send({ type:'bridge', on:true });
  updateShareUI();
});
window.postMessage({ bt:'ping' }, '*');
setInterval(pushBridgeState, 2000);
function relay(msg, except){
  for (const [id, c] of conns) if (id !== except && c.open) c.send(msg);
}
function onData(msg, fromPeer){
  if (!msg || typeof msg !== 'object') return;
  if (isHost){
    // Someone not let in yet can only ask to join; everything else is ignored.
    if (!people[fromPeer]){
      if (msg.type === 'hello') askToJoin(fromPeer, String(msg.name || 'Player').slice(0, 20));
      return;
    }
    if (msg.type === 'hello') return;
    msg.from = fromPeer;          // never trust a claimed sender
    if (people[fromPeer].kind === 'tab') return;              // controlled tabs only listen
    if (msg.type === 'control') return;                       // only the host decides this
    if (msg.type === 'input'){ if (control) routeInput(msg); return; }
    relay(msg, fromPeer);
  }
  apply(msg);
}
function nameOf(id){ return (people[id] && people[id].name) || 'Someone'; }

function apply(msg){
  switch (msg.type){
    case 'welcome':
      people = msg.people || {}; sharer = msg.sharer || null; control = !!msg.control;
      setStrokes(Array.isArray(msg.strokes) ? msg.strokes : []);
      setStickers(Array.isArray(msg.stickers) ? msg.stickers : []);
      if (msg.tabInfo) showTabInfo(msg.tabInfo);
      updateControlUI(); renderPeople(); setMode(msg.mode || 'screen');
      if (msg.url) loadUrl(msg.url);
      updateShareUI(); sys('You joined the room.');
      break;
    case 'people':
      people = msg.people || {};
      if ('sharer' in msg) sharer = msg.sharer;
      renderPeople(); updateShareUI();
      if (msg.joined && msg.joined !== myId && !isTab(msg.joined)){
        sys(nameOf(msg.joined) + ' joined.');
        if (localStream) callPeer(msg.joined);   // late joiner gets the stream
      }
      if (msg.left){
        if (msg.leftKind !== 'tab') sys((msg.leftName || 'Someone') + ' left.');
        removeCursor(msg.left);
        if (!sharer && !localStream) clearVideo();
      }
      break;
    case 'chat': addChat(msg.from, String(msg.text || '').slice(0,400)); break;
    case 'mode': setMode(msg.mode); break;
    case 'url': {
      const u = safeUrl(msg.url); if (!u || sameSiteAsRoom(u)) break;
      loadUrl(u);
      if (msg.from !== myId) sys(nameOf(msg.from) + ' opened ' + u);
      break;
    }
    case 'share':
      if (msg.on){
        if (msg.from !== myId && localStream) stopShare(true);  // someone took over
        sharer = msg.from;
        if (msg.from !== myId) sys(nameOf(msg.from) + ' started sharing.');
      } else {
        if (sharer === msg.from) sharer = null;
        if (msg.from !== myId){ clearVideo(); sys(nameOf(msg.from) + ' stopped sharing.'); }
      }
      renderPeople(); updateShareUI();
      break;
    case 'ptr':
      if (msg.from !== myId) drawPointer(msg);
      if (msg.mode === 'screen' && !msg.hide) forwardToBridge(msg, mayControl(msg.from));
      break;
    case 'input': forwardToBridge(msg, mayControl(msg.from)); break;
    case 'bridge':
      if (people[msg.from]) people[msg.from].bridge = !!msg.on;
      renderPeople(); updateShareUI();
      break;
    case 'stroke': addStroke(msg); break;
    case 'sticker': createSticker(msg); break;
    case 'tabinfo':
      if (people[msg.from] && people[msg.from].bridge) showTabInfo(msg);
      break;
    case 'stk': updateSticker(msg); break;
    case 'stkDel': removeSticker(String(msg.id)); break;
    case 'unstroke': {
      const st = strokeMap.get(String(msg.id));
      if (st && st.from === msg.from){ setStrokes(strokes.filter(x => x !== st)); }
      break;
    }
    case 'clear':
      setStrokes(strokes.filter(x => x.mode !== msg.mode));
      sys(nameOf(msg.from) + ' cleared all drawings.');
      break;
    case 'control':
      control = !!msg.on; updateControlUI();
      sys(control ? 'Everyone can now control the shared tab. Click the view to use it.' : 'Only the host can control the shared tab now.');
      break;
  }
}

// ---------- room UI ----------
function enterRoom(code){
  roomCode = code;
  $('#lobby').hidden = true; $('#room').hidden = false;
  $('#roomCode').textContent = code;
  try { history.replaceState(null, '', '#' + code); } catch(e){}
  renderPeople(); setMode(mode); updateControlUI();
  if (hasBridge) send({ type:'bridge', on:true });
}
function isTab(id){ return !!(people[id] && people[id].kind === 'tab'); }
function hasTab(){ return Object.values(people).some(p => p.bridge || p.kind === 'tab'); }
function updateControlUI(){
  const b = $('#controlBtn');
  b.hidden = !isHost;
  b.setAttribute('aria-checked', String(control));
  overlay.classList.toggle('ctl', control || isHost || hasBridge);
  pushBridgeState();
  updateShareUI();
}
$('#controlBtn').onclick = () => send({ type:'control', on: !control });
function renderPeople(){
  const box = $('#people'); box.innerHTML = '';
  for (const p of Object.values(people)){
    const chip = document.createElement('span'); chip.className = 'chip';
    const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = p.color;
    const t = document.createElement('span');
    t.textContent = p.name + (p.id === myId ? ' (you)' : '');
    chip.append(dot, t);
    const tag = (text, cls, title) => { const g = document.createElement('span'); g.className = 'tag' + (cls ? ' ' + cls : ''); g.textContent = text; if (title) g.title = title; chip.append(g); };
    if (p.id.startsWith(PREFIX)) tag('host', '', 'Started the room');
    if (p.id === sharer) tag('sharing', 'live', 'Their tab is on screen');
    if (p.bridge) tag('tab control', '', 'Has tab control set up');
    if (isHost && p.id !== myId){
      const x = document.createElement('button'); x.className = 'kick'; x.textContent = '×';
      x.title = 'Remove ' + p.name + ' from the room'; x.setAttribute('aria-label', x.title);
      x.onclick = () => removePerson(p.id);
      chip.append(x);
    }
    box.append(chip);
  }
}
$('#copyBtn').onclick = async () => {
  const text = location.protocol.startsWith('http') ? location.href.split('#')[0] + '#' + roomCode : roomCode;
  const hint = $('#copyBtn .hint');
  try { await navigator.clipboard.writeText(text); hint.textContent = 'Link copied'; }
  catch(e){ prompt('Copy this invite link:', text); }
  setTimeout(() => hint.textContent = 'Copy invite link', 1600);
};
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => send({ type:'mode', mode:b.dataset.mode }));

function setMode(m){
  mode = (m === 'page') ? 'page' : 'screen';
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  $('#screenTools').hidden = mode !== 'screen';
  $('#urlForm').hidden = mode !== 'page';
  video.hidden = mode !== 'screen';
  frame.hidden = mode !== 'page';
  overlay.style.pointerEvents = (mode === 'screen' || pointMode) ? 'auto' : 'none';
  overlay.style.cursor = mode === 'screen' ? 'crosshair' : (pointMode ? 'crosshair' : '');
  updatePlaceholder();
  Object.keys(cursors).forEach(removeCursor);
  redraw();
}
function updatePlaceholder(){
  let title = '', text = '';
  if (mode === 'screen' && !video.srcObject){
    title = 'Nobody is sharing yet';
    text = navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia
      ? 'Click Share my tab and pick the tab everyone should see. Tick "Share tab audio" so friends hear it too.'
      : 'This browser can\'t share a tab, but you can watch when someone else shares. To share, use Chrome, Edge or Firefox on a computer.';
  } else if (mode === 'page' && !curUrl){
    title = 'Load a site for everyone';
    text = 'Paste a link above. YouTube and Wikipedia work well. Sites like X and Instagram block this, so share a tab for those instead.';
  }
  $('#placeholder').hidden = !title;
  $('#phTitle').textContent = title;
  $('#phText').textContent = text;
}

// ---------- screen share ----------
function updateShareUI(){
  const btn = $('#shareBtn');
  const can = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
  btn.disabled = !can;
  btn.querySelector('.lbl').textContent = localStream ? 'Stop sharing' : (sharer && sharer !== myId ? 'Share my tab instead' : 'Share my tab');
  btn.querySelector('use').setAttribute('href', localStream ? '#i-stop' : '#i-share');
  btn.classList.toggle('primary', !localStream);

  // One short line per fact, most important first.
  const notes = [];
  if (scriptOutdated()) notes.push(['warn', 'Tab control is out of date, so opening sites won\'t work. Click Update tab control.']);
  if (bridgeKeys.size > 1) notes.push(['warn', 'Tab control is installed twice. Remove the extra copy in Tampermonkey.']);
  if (sharer === myId) notes.push(['', 'You\'re sharing your tab. Friends\' pointers show on your preview.']);
  else if (sharer) notes.push(['', nameOf(sharer) + ' is sharing. Click the view to point at things.']);
  if (hasTab()){
    if (control) notes.push(['', 'Everyone can click, scroll and type in the shared tab.']);
    else if (isHost) notes.push(['', 'Only you can control the shared tab.']);
  } else if (control){
    notes.push(['warn', 'Friends can control, but nobody has tab control set up yet.']);
  }
  if (hasBridge && !scriptOutdated()) notes.push(['ok', 'Tab control ready (v' + bridgeVersion + ')']);
  const bar = $('#shareInfo'); bar.textContent = '';
  for (const [cls, text] of notes){ const n = document.createElement('span'); if (cls) n.className = cls; n.textContent = text; bar.append(n); }
  bar.style.display = 'contents';
  $('#statusbar').hidden = !notes.length;

  const link = $('#scriptLink');
  link.hidden = hasBridge && !scriptOutdated();
  link.classList.toggle('warn', scriptOutdated());
  link.querySelector('.lbl').textContent = scriptOutdated() ? 'Update tab control' : 'Set up tab control';
  $('#navForm').hidden = !canNavigate();
  $('#screenTools').classList.toggle('wide', canNavigate());
}
$('#shareBtn').onclick = () => localStream ? stopShare(false) : startShare();

async function startShare(){
  try {
    localStream = await navigator.mediaDevices.getDisplayMedia({ video:{ frameRate:30 }, audio:true });
  } catch(e){ return; }
  const track = localStream.getVideoTracks()[0];
  track.addEventListener('ended', () => stopShare(false));
  offerControl(track);
  // The shared tab gets a new ID whenever it loads a new page.
  track.addEventListener('capturehandlechange', () => offerControl(track));
  showStream(localStream, true);
  send({ type:'share', on:true });
  if (mode !== 'screen') send({ type:'mode', mode:'screen' });
  for (const id in people) if (id !== myId && !isTab(id)) callPeer(id);
  updateShareUI();
}
// If the shared tab runs the control script, ask it (via our own script) to
// show a "Connect" prompt so the person can link it with one click.
function offerControl(track){
  let h = null;
  try { h = track.getCaptureHandle ? track.getCaptureHandle() : null; } catch(e){}
  const handle = h && typeof h.handle === 'string' ? h.handle : '';
  if (handle.startsWith('bt:') && hasBridge){
    window.postMessage({ bt:'offer', key:bridgeKey, handle, room:roomCode }, '*');
  }
}
function callPeer(id){
  if (!localStream) return;
  try { calls.set(id, peer.call(id, localStream)); } catch(e){}
}
function stopShare(silent){
  if (!localStream) return;
  localStream.getTracks().forEach(t => t.stop());
  localStream = null;
  calls.forEach(c => { try { c.close(); } catch(e){} }); calls.clear();
  clearVideo();
  if (!silent) send({ type:'share', on:false });
  updateShareUI();
}
function answerCall(call){
  call.answer();
  call.on('stream', s => showStream(s, false));
}
function showStream(stream, isLocal){
  video.srcObject = stream;
  video.muted = isLocal;            // never play your own tab back to yourself
  if (!isLocal) video.volume = volumeLevel;
  $('#unmute').hidden = true;
  video.play().catch(() => { video.muted = true; video.play().catch(()=>{}); $('#unmute').hidden = isLocal; });
  updatePlaceholder();
  updateVolumeUI();
}
function clearVideo(){ video.srcObject = null; $('#unmute').hidden = true; updatePlaceholder(); updateVolumeUI(); }
$('#unmute').onclick = () => { video.muted = false; if (!video.volume) video.volume = volumeLevel || 0.5; video.play(); $('#unmute').hidden = true; };

// ---------- volume (only for people watching someone else's tab) ----------
let volumeLevel = 1;
try { const v = parseFloat(localStorage.getItem('bt-volume')); if (v >= 0 && v <= 1) volumeLevel = v; } catch(e){}
function updateVolumeUI(){
  const watching = !!video.srcObject && !localStream;
  $('#volume').hidden = !watching;
  if (!watching) return;
  const silent = video.muted || video.volume === 0;
  $('#volSlider').value = silent ? 0 : video.volume;
  $('#muteBtn use').setAttribute('href', silent ? '#i-mute' : '#i-sound');
  $('#muteBtn').title = silent ? 'Unmute' : 'Mute';
  $('#muteBtn').setAttribute('aria-label', silent ? 'Unmute' : 'Mute');
}
function rememberVolume(v){ volumeLevel = v; try { localStorage.setItem('bt-volume', String(v)); } catch(e){} }

function safeUrl(u){
  try { const x = new URL(String(u)); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch(e){ return ''; }
}
function normalize(input){
  let u = input.trim(); if (!u) return '';
  if (!/^https?:\/\//i.test(u)){
    u = (/\s/.test(u) || !u.includes('.'))
      ? 'https://en.wikipedia.org/w/index.php?search=' + encodeURIComponent(u)

  }
  const yt = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/)|youtu\.be\/)([\w-]{11})/);
  if (yt) u = 'https://www.youtube.com/embed/' + yt[1] + '?autoplay=1';

function contentRect(){
  const s = $('#stage').getBoundingClientRect();
  if (mode === 'screen' && video.videoWidth){
    const vr = video.videoWidth / video.videoHeight, er = s.width / s.height;
    let w, h; if (vr > er){ w = s.width; h = w / vr; } else { h = s.height; w = h * vr; }
    return { left:s.left + (s.width - w)/2, top:s.top + (s.height - h)/2, width:w, height:h, sl:s.left, st:s.top };
  }
  return { left:s.left, top:s.top, width:s.width, height:s.height, sl:s.left, st:s.top };
}
let lastSend = 0;
function sendPtr(e, click){
  const r = contentRect();
  const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  if (x < 0 || y < 0 || x > 1 || y > 1) return;
  const now = performance.now();
  if (!click && now - lastSend < 45) return;
  lastSend = now;
  send({ type:'ptr', x:+x.toFixed(4), y:+y.toFixed(4), click:!!click, mode });
}

overlay.tabIndex = 0;
function canControl(){ return (control || isHost || hasBridge) && mode === 'screen' && !!video.srcObject && hasTab(); }

  const r = contentRect();
  let x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  if (clamp){ x = Math.min(1, Math.max(0, x)); y = Math.min(1, Math.max(0, y)); }

let ctlDown = false;

  wheelAcc.dx += e.deltaX * mult; wheelAcc.dy += e.deltaY * mult; wheelAcc.x = p.x; wheelAcc.y = p.y;

const cursors = {}, hideTimers = {};

// ---------- drawing ----------
const SIZES = [['S', 0.002], ['M', 0.004], ['L', 0.009]];
let drawOn = false, sizeIdx = 1, strokeN = 0, cur = null, pending = [], flushTimer = 0;
const MAX_POINTS = 40000;

function sizeCanvas(){
  const s = $('#stage').getBoundingClientRect(), d = devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(s.width * d));
  canvas.height = Math.max(1, Math.round(s.height * d));
  canvas.style.width = s.width + 'px'; canvas.style.height = s.height + 'px';
  redraw();
}
function redraw(){
  const d = devicePixelRatio || 1;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const st of strokes) if (st.mode === mode) drawStroke(st, 0);
  layoutStickers();
}
function drawStroke(st, from){
  const p = st.pts; if (!p.length) return;
  const r = contentRect(), ox = r.left - r.sl, oy = r.top - r.st;
  const X = q => ox + q[0] * r.width, Y = q => oy + q[1] * r.height;
  ctx.strokeStyle = st.c; ctx.lineWidth = Math.max(1.5, st.w * r.width);
  ctx.lineCap = ctx.lineJoin = 'round';
  ctx.beginPath();
  const i0 = Math.max(0, from - 1);
  ctx.moveTo(X(p[i0]), Y(p[i0]));
  if (p.length === 1) ctx.lineTo(X(p[0]) + 0.1, Y(p[0]));
  for (let i = i0 + 1; i < p.length; i++) ctx.lineTo(X(p[i]), Y(p[i]));
  ctx.stroke();
}
function cleanStroke(m){
  const id = String(m.id || '').slice(0, 120);
  if (!m.from || !id.startsWith(m.from + '-')) return null;     // only your own lines
  return {
    id, from: m.from,
    c: /^#[0-9a-f]{6}$/i.test(m.c) ? m.c : '#ffffff',
    w: Math.min(0.03, Math.max(0.001, Number(m.w) || 0.004)),
    mode: m.mode === 'page' ? 'page' : 'screen', pts: []
  };
}
function addStroke(m){
  const add = Array.isArray(m.add) ? m.add.slice(0, 600) : [];
  if (!add.length) return;
  let st = strokeMap.get(String(m.id));
  if (st){ if (st.from !== m.from) return; }
  else { st = cleanStroke(m); if (!st) return; strokes.push(st); strokeMap.set(st.id, st); }
  const start = st.pts.length;
  for (const q of add) st.pts.push([unit(q && q[0]), unit(q && q[1])]);

  else if (st.mode === mode) drawStroke(st, start);
}
function trimStrokes(){
  let total = strokes.reduce((n, x) => n + x.pts.length, 0), trimmed = false;
  while (total > MAX_POINTS && strokes.length > 1){
    const old = strokes.shift(); strokeMap.delete(old.id); total -= old.pts.length; trimmed = true;
  }
  return trimmed;
}
function setStrokes(list){
  strokes = []; strokeMap.clear();
  for (const raw of list){
    const st = cleanStroke(raw); if (!st || !Array.isArray(raw.pts)) continue;
    st.pts = raw.pts.slice(0, MAX_POINTS).map(q => [unit(q && q[0]), unit(q && q[1])]);
    strokes.push(st); strokeMap.set(st.id, st);
  }

}
function flushStroke(){
  clearTimeout(flushTimer); flushTimer = 0;
  if (!cur || !pending.length) return;
  send({ type:'stroke', id:cur, add:pending, c:(people[myId] || {}).color || '#ffffff', w:SIZES[sizeIdx][1], mode });
  pending = [];
}
canvas.addEventListener('pointerdown', e => {
  if (!drawOn) return;
  const p = normPos(e, false); if (!p) return;
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch(err){}
  cur = myId + '-' + (++strokeN) + '-' + Date.now().toString(36);
  pending = [[p.x, p.y]];
  flushStroke();
});
canvas.addEventListener('pointermove', e => {
  if (!cur) return;
  const p = normPos(e, true);
  pending.push([p.x, p.y]);
  if (!flushTimer) flushTimer = setTimeout(flushStroke, 40);

['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t =>
  canvas.addEventListener(t, () => { if (cur){ flushStroke(); cur = null; } }));

$('#drawBtn').onclick = () => {

// ---------- stickers ----------
const MAX_STICKERS = 30, MAX_SRC = 2000000, MAX_URL = 2000, MAX_GIF_BYTES = 1400000;
const SRC_RE = /^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/;
// A sticker image is either embedded data or a web link that every viewer loads.
function okSrc(src){
  if (typeof src !== 'string') return false;
  if (src.startsWith('data:')) return src.length <= MAX_SRC && SRC_RE.test(src);
  if (src.length > MAX_URL) return false;
  try { const u = new URL(src); return u.protocol === 'https:' || u.protocol === 'http:'; } catch(e){ return false; }
}
const clampN = (v, lo, hi, d) => { const n = Number(v); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : d; };

function stickerList(){
  return [...stickers.values()].map(({ el, ...rest }) => rest);
}
function applyGeom(st, m){
  st.x = unit(m.x); st.y = unit(m.y);
  st.w = clampN(m.w, 0.02, 1.5, st.w || 0.25);
  st.r = clampN(m.r, -1000, 1000, st.r || 0);
  st.z = Math.round(clampN(m.z, 0, 1e6, st.z || 1));
  topZ = Math.max(topZ, st.z);
}
function createSticker(m){
  const id = String(m.id || '').slice(0, 120);
  if (!m.from || !id.startsWith(m.from + '-') || stickers.has(id)) return;
  if (!okSrc(m.src)) return;
  const st = { id, from:m.from, src:m.src, a:clampN(m.a, 0.05, 20, 1), mode: m.mode === 'page' ? 'page' : 'screen' };
  applyGeom(st, m);
  makeStickerEl(st);
  stickers.set(id, st);
  while (stickers.size > MAX_STICKERS) removeSticker(stickers.keys().next().value);
  layoutSticker(st);
}
function updateSticker(m){
  const st = stickers.get(String(m.id)); if (!st) return;
  if (gesture && gesture.st === st && m.from !== myId) return;   // I'm holding it right now
  applyGeom(st, m); layoutSticker(st);
}
function removeSticker(id){
  const st = stickers.get(id); if (!st) return;
  st.el.remove(); stickers.delete(id);
  if (selectedSticker === id) selectedSticker = null;
  if (gesture && gesture.st === st) gesture = null;
}
function setStickers(list){
  for (const id of [...stickers.keys()]) removeSticker(id);
  for (const m of list) createSticker(m);
}

function makeStickerEl(st){
  const el = document.createElement('div'); el.className = 'sticker';
  const img = new Image(); img.referrerPolicy = 'no-referrer'; img.alt = ''; img.draggable = false;
  img.onerror = () => { img.style.background = 'repeating-linear-gradient(45deg,#333 0 8px,#444 8px 16px)'; img.title = 'This image link could not be loaded'; };
  img.src = st.src;
  const rot = document.createElement('div'); rot.className = 'h rot'; rot.title = 'Drag to rotate (hold Shift to snap)';
  const sc = document.createElement('div'); sc.className = 'h scale'; sc.title = 'Drag to resize';
  const del = document.createElement('button'); del.className = 'h del'; del.textContent = '×'; del.title = 'Remove sticker';
  el.append(img, rot, sc, del);
  $('#stickers').append(el);
  st.el = el;
  del.addEventListener('pointerdown', e => e.stopPropagation());
  del.addEventListener('click', e => { e.stopPropagation(); send({ type:'stkDel', id:st.id }); });
  el.addEventListener('pointerdown', e => startGesture(e, st, e.target === rot ? 'rot' : e.target === sc ? 'scale' : 'move'));
  el.addEventListener('wheel', e => {
    e.preventDefault();
    selectSticker(st);
    if (e.shiftKey) st.r += Math.sign(e.deltaY || e.deltaX) * Math.PI / 36;
    else st.w = clampN(st.w * (e.deltaY < 0 ? 1.08 : 1 / 1.08), 0.02, 1.5, st.w);
    layoutSticker(st); queueSticker(st);
  }, { passive:false });
}
function layoutSticker(st){
  const visible = st.mode === mode;
  st.el.hidden = !visible;
  if (!visible) return;
  const r = contentRect(), w = st.w * r.width;
  st.el.style.left = (r.left - r.sl + st.x * r.width) + 'px';
  st.el.style.top = (r.top - r.st + st.y * r.height) + 'px';
  st.el.style.width = w + 'px';
  st.el.style.height = (w * st.a) + 'px';
  st.el.style.transform = 'translate(-50%,-50%) rotate(' + st.r + 'rad)';
  st.el.style.zIndex = st.z;
  st.el.classList.toggle('sel', selectedSticker === st.id);
}
function layoutStickers(){ for (const st of stickers.values()) layoutSticker(st); }
function selectSticker(st){ selectedSticker = st ? st.id : null; layoutStickers(); }

// dragging, rotating, resizing
let gesture = null, stkTimer = 0;
const stkPending = new Set();
function startGesture(e, st, kind){
  if (drawOn || e.button !== 0) return;
  e.preventDefault(); e.stopPropagation();
  st.z = ++topZ;
  selectSticker(st);
  const r = contentRect();
  const cx = r.left + st.x * r.width, cy = r.top + st.y * r.height;
  gesture = {
    st, kind, r, sx:e.clientX, sy:e.clientY, x0:st.x, y0:st.y, w0:st.w, r0:st.r, cx, cy,
    d0: Math.hypot(e.clientX - cx, e.clientY - cy) || 1,
    a0: Math.atan2(e.clientY - cy, e.clientX - cx)

  try { st.el.setPointerCapture(e.pointerId); } catch(err){}
  queueSticker(st);
}
document.addEventListener('pointermove', e => {
  if (!gesture) return;
  const g = gesture, st = g.st;
  if (g.kind === 'move'){
    st.x = unit(g.x0 + (e.clientX - g.sx) / g.r.width);
    st.y = unit(g.y0 + (e.clientY - g.sy) / g.r.height);
  } else if (g.kind === 'scale'){
    st.w = clampN(g.w0 * Math.hypot(e.clientX - g.cx, e.clientY - g.cy) / g.d0, 0.02, 1.5, st.w);
  } else {
    let a = g.r0 + Math.atan2(e.clientY - g.cy, e.clientX - g.cx) - g.a0;
    if (e.shiftKey){ const step = Math.PI / 12; a = Math.round(a / step) * step; }
    st.r = a;
  }
  layoutSticker(st); queueSticker(st);
});
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, () => {
  if (gesture){ flushStickers(); gesture = null; }
}));
document.addEventListener('pointerdown', e => {
  if (selectedSticker && !(e.target.closest && e.target.closest('.sticker'))) selectSticker(null);
});
document.addEventListener('keydown', e => {
  if (!selectedSticker || (e.key !== 'Delete' && e.key !== 'Backspace')) return;
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a === overlay)) return;
  e.preventDefault();
  send({ type:'stkDel', id:selectedSticker });
});
function queueSticker(st){
  stkPending.add(st.id);
  if (!stkTimer) stkTimer = setTimeout(flushStickers, 50);
}
function flushStickers(){
  clearTimeout(stkTimer); stkTimer = 0;
  for (const id of stkPending){
    const st = stickers.get(id);
    if (st) send({ type:'stk', id, x:+st.x.toFixed(4), y:+st.y.toFixed(4), w:+st.w.toFixed(4), r:+st.r.toFixed(4), z:st.z });
  }
  stkPending.clear();
}

// adding: button, paste, drag & drop
async function addStickerFile(file){
  if (!file || !roomCode) return;
  if (!file.type.startsWith('image/')) return sys('That file isn\'t an image.');
  if (file.type === 'image/gif' && await addGifFile(file) !== false) return;
  let bmp;
  try { bmp = await createImageBitmap(file); } catch(e){ return sys('That image could not be read.'); }
  let src = '', side = 512, q = 0.85;
  for (let i = 0; i < 5; i++){
    const k = Math.min(1, side / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    src = c.toDataURL('image/webp', q);
    if (!src.startsWith('data:image/webp')) src = c.toDataURL('image/png');
    if (src.length <= 300000) break;
    side = Math.round(side * 0.75); q = Math.max(0.5, q - 0.1);
  }
  if (src.length > MAX_SRC) return sys('That image is too big to share.');
  placeSticker(src, bmp.width, bmp.height);
}
function placeSticker(src, width, height){
  if (!roomCode || !okSrc(src)) return;
  const a = clampN(height / width, 0.05, 20, 1);
  const r = contentRect();
  let w = 0.25;
  if (w * r.width * a > 0.45 * r.height) w = Math.max(0.02, 0.45 * r.height / (a * r.width));
  send({ type:'sticker', id: myId + '-s' + (++stickerN) + '-' + Date.now().toString(36),
         src, a, x:0.5, y:0.5, w, r:0, z:++topZ, mode });
}
// Animated GIF files are sent as-is so they keep moving.
function readAsDataUrl(file){
  return new Promise((ok, fail) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = fail; fr.readAsDataURL(file); });
}
async function addGifFile(file){
  let bmp;
  try { bmp = await createImageBitmap(file); } catch(e){ return sys('That GIF could not be read.'); }
  if (file.size > MAX_GIF_BYTES){
    sys('That GIF is too big to send animated (max ~1.4 MB), so it was added as a still image. Paste a link to it instead to keep it moving.');
    return false;
  }
  const src = await readAsDataUrl(file).catch(() => '');
  if (!src) return sys('That GIF could not be read.');
  placeSticker(String(src), bmp.width, bmp.height);
  return true;
}
function looksLikeUrl(text){ return /^https?:\/\/\S+$/i.test(text) && text.length <= MAX_URL; }
function addStickerUrl(url){
  if (!roomCode || !okSrc(url)) return;
  const img = new Image();
  img.referrerPolicy = 'no-referrer';
  img.onload = () => placeSticker(url, img.naturalWidth || 1, img.naturalHeight || 1);
  img.onerror = () => sys('That link didn\'t load as an image. It may have expired, need a login, or not be a direct image link.');
  img.src = url;
}
$('#stickerBtn').onclick = () => $('#stickerFile').click();
$('#stickerFile').onchange = e => { addStickerFile(e.target.files[0]); e.target.value = ''; };
document.addEventListener('paste', e => {
  if (!roomCode || !e.clipboardData) return;
  const item = [...e.clipboardData.items].find(i => i.kind === 'file' && i.type.startsWith('image/'));
  if (item){ e.preventDefault(); addStickerFile(item.getAsFile()); return; }
  // A pasted link becomes a sticker, unless you're typing in a text box.
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;
  const text = (e.clipboardData.getData('text') || '').trim();
  if (looksLikeUrl(text)){ e.preventDefault(); addStickerUrl(text); }
});
const stageEl = $('#stage');
stageEl.addEventListener('dragover', e => {
  const types = [...e.dataTransfer.types];
  if (!types.includes('Files') && !types.includes('text/uri-list')) return;
  e.preventDefault(); stageEl.classList.add('dropping');
});
stageEl.addEventListener('dragleave', () => stageEl.classList.remove('dropping'));
stageEl.addEventListener('drop', e => {
  stageEl.classList.remove('dropping');
  const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
  if (f){ e.preventDefault(); addStickerFile(f); return; }
  const link = (e.dataTransfer.getData('text/uri-list') || '').split(/\r?\n/).find(l => l && !l.startsWith('#'))
    || (e.dataTransfer.getData('text/plain') || '').trim();
  if (looksLikeUrl(link)){ e.preventDefault(); addStickerUrl(link); }
});

// ---------- chat ----------
function addLine(node){ const log = $('#log'); log.append(node); log.scrollTop = log.scrollHeight; }
function addChat(from, text){
  const p = people[from] || { name:'Someone', color:'#ccc' };
  const d = document.createElement('div'); d.className = 'msg';
  const b = document.createElement('b'); b.textContent = p.name; b.style.color = p.color;
  d.append(b, document.createTextNode(text)); addLine(d);
}
function sys(text){ const d = document.createElement('div'); d.className = 'sys'; d.textContent = text; addLine(d); }
$('#chatForm').onsubmit = e => {
  e.preventDefault();
  const t = $('#chatInput').value.trim(); if (!t) return;
  send({ type:'chat', text:t }); $('#chatInput').value = '';
};

// ---------- misc ----------
$('#fsBtn').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else $('#stage').requestFullscreen && $('#stage').requestFullscreen();
};
window.addEventListener('beforeunload', () => { try { peer && peer.destroy(); } catch(e){} });
